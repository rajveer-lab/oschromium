<!doctype html><html><head><meta charset="utf-8"><title>Team meeting – Call</title></head><body style="font:16px system-ui;padding:24px"><h1>Team meeting – Call</h1><p>In a call.</p><script>window.startCall=async()=>{window.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});return stream.getTracks().length};window.endCall=()=>{stream.getTracks().forEach(t=>t.stop());return "ended"};</script></body></html>
