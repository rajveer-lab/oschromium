<!doctype html><html><head><meta charset="utf-8"><title>Lo-fi movie trailer – video</title></head><body style="font:16px system-ui;padding:24px"><h1>Lo-fi movie trailer – video</h1><p>Playing a tone.</p><script>let ctx,osc;window.play=()=>{ctx=new AudioContext();osc=ctx.createOscillator();const g=ctx.createGain();g.gain.value=0.05;osc.connect(g).connect(ctx.destination);osc.start();return ctx.state};window.pausePlayback=()=>{osc&&osc.stop();ctx&&ctx.close();return "paused"};</script></body></html>
